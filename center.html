<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACTS 개인 손편지 제작센터</title><link rel="stylesheet" href="styles.css?v=1.0.0"><style>body{background:#f7f3e8}.editor{max-width:720px;margin:auto;padding:34px 20px 70px}.editor header{text-align:center;margin-bottom:25px}.form,.preview,.result{background:#fff;border:1px solid #e1e6e2;border-radius:22px;padding:22px;margin:16px 0}.form label{display:block;font-weight:800;margin:16px 0 6px}.form input,.form select,.form textarea{width:100%;padding:12px;border:1px solid #ccd5cf;border-radius:10px;font:inherit}.form textarea{min-height:150px}.primary{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:#173f35;color:#fff;font-weight:900;font-size:16px}.preview-head{display:flex;gap:14px;align-items:center}.preview img{width:72px;height:72px;border-radius:50%;object-fit:cover}.result input{width:100%;padding:11px}.row{display:flex;gap:8px;margin-top:10px}.row button,.row a{flex:1;text-align:center;padding:11px;border:0;border-radius:10px;background:#173f35;color:#fff;text-decoration:none;font-weight:800}</style></head><body><div class="editor"><header><img src="assets/acts-logo.webp" width="76" alt="ACTS"><p class="eyebrow">손안의 마법사 · ACTS</p><h1>개인 손편지 제작센터</h1><p>이름·호칭·사진·짧은 편지만 넣으면 ACTS 소개 이야기 앞에 개인 손편지가 붙습니다.</p></header><form id="form" class="form"><label>받는 분 이름</label><input id="name" required placeholder="예: 김요한"><label>호칭</label><select id="honor"><option>목사님</option><option>선교사님</option><option>회장님</option><option>총재님</option><option>관장님</option><option>대표님</option><option>님</option><option>형님</option><option>누님</option><option>친구에게</option></select><label>받는 분 사진 (선택)</label><input id="photo" type="file" accept="image/*"><label>개인 편지</label><textarea id="message" placeholder="예: 오랜만입니다. 제가 요즘 마음을 두고 준비하고 있는 ACTS 선교연합 이야기를 짧게 전하고 싶어 이 편지를 보냅니다."></textarea><button class="primary" type="submit">✨ 개인 손편지 링크 만들기</button></form><div class="preview"><b>미리보기</b><div class="preview-head"><img id="previewPhoto" hidden alt="미리보기"><div><h3 id="previewTo">받는 분께</h3><p id="previewMessage">개인 편지가 여기에 표시됩니다.</p></div></div></div><div id="result" class="result" hidden><b>완성된 개인 링크</b><input id="url" readonly><div class="row"><button id="copy" type="button">링크 복사</button><a id="open" target="_blank">열어보기</a></div><small id="status"></small></div><p style="text-align:center"><a href="./">← 공용 ACTS 이야기로 돌아가기</a></p></div><script src="config.js?v=1.0.0"></script><script src="card-store.js?v=1.0.0"></script><script src="center.js?v=1.0.0"></script></body></html>
